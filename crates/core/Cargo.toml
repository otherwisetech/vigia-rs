[package]
name = "vigia-core"
description = "Vigía's engine: items that expire, recurrence and reminder math, SQLite storage, RDAP and TLS checks, CSV / ICS, OCR assist. No UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "vigia_core"

[features]
default = ["ocr"]
# Local OCR of a scanned document (ocrs, pure Rust) and the text layer of PDFs.
ocr = ["dep:ocrs", "dep:rten", "dep:image", "dep:pdf-extract"]

[dependencies]
i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
otherwise-link.workspace = true
uuid.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
# RDAP lookups (https) and the OCR model download; nothing else talks to the network
ureq = { version = "3", default-features = false, features = ["rustls"] }
# reading a host's certificate, expired or not (we never trust it, only read notAfter)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
ocrs = { version = "0.14", optional = true }
rten = { version = "0.28", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
pdf-extract = { version = "0.10", optional = true }

[dev-dependencies]
tempfile = "3"
