[package]
name = "vigia-cli"
description = "vigia: headless command line for Vigía (list, due, add, renew) for scripts and agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vigia"
path = "src/main.rs"

[dependencies]
vigia-core = { workspace = true, default-features = false }
i18n.workspace = true
serde_json.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile = "3"
