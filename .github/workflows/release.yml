name: Release

# Builds downloadable apps for macOS, Linux and Windows.
# - push a tag like v0.2.0 → a GitHub Release with the three downloads attached
# - "Run workflow" by hand → the same builds as workflow artifacts, no release
# - "Run workflow" with a tag → rebuilds that tag and attaches the downloads to its release
# The release step creates the release if it doesn't exist yet, otherwise it only adds (or
# replaces) the files built here, each with a .sha256: notes and files uploaded by hand (e.g. a
# local <bin>-macos-arm64.zip) are kept.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and attach to its release (empty: build only)"
        required: false
        default: ""
      skip_tests:
        description: "Skip the tests (only to rebuild a tag whose tests already passed elsewhere)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev libasound2-dev \
            libzstd-dev pkg-config

      - name: Test core crates
        if: ${{ !inputs.skip_tests }}
        run: cargo test -p vigia-i18n -p vigia-core -p vigia-cli

      - name: Build (macOS universal .app)
        if: runner.os == 'macOS'
        run: |
          UNIVERSAL=1 script/bundle-macos.sh
          mkdir -p dist
          ditto -c -k --keepParent target/release/Vigía.app dist/vigia-${{ matrix.name }}.zip

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build -p vigia-app -p vigia-cli --release
          pkg=vigia-${{ matrix.name }}
          mkdir -p dist/$pkg
          cp target/release/vigia-app target/release/vigia dist/$pkg/
          target/release/vigia background manifest > dist/$pkg/otherwise-background.json
          cp packaging/linux/io.github.otherwisetech.vigia-app.desktop dist/$pkg/
          cp crates/app/assets/logo/vigia-icon-1024.png dist/$pkg/vigia.png
          cp README.md LICENSE-MIT LICENSE-APACHE dist/$pkg/
          tar -C dist -czf dist/$pkg.tar.gz $pkg
          rm -rf dist/$pkg

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p vigia-app -p vigia-cli --release
          $pkg = "vigia-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path dist/$pkg | Out-Null
          Copy-Item target/release/vigia-app.exe, target/release/vigia.exe dist/$pkg/
          target/release/vigia.exe background manifest | Out-File -Encoding utf8NoBOM dist/$pkg/otherwise-background.json
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE dist/$pkg/
          Compress-Archive -Path dist/$pkg -DestinationPath dist/$pkg.zip
          Remove-Item -Recurse dist/$pkg

      - uses: actions/upload-artifact@v4
        with:
          name: vigia-${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: for f in *; do sha256sum "$f" > "$f.sha256"; done
      - name: Create the release, or add these files to it
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes
          fi
